<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="Illustration of a Swiss trust shield, a stack of assets with a fifty million dollar tag, and a government building connected by a dashed path." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1a2e"/><stop offset="1" stop-color="#274468"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d27a"/><stop offset="1" stop-color="#c08a1e"/></linearGradient>
<linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf3"/><stop offset="1" stop-color="#aab4c4"/></linearGradient>
<linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b6ea5"/><stop offset="1" stop-color="#16324f"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<!-- alpine backdrop -->
<path d="M0 640 L180 470 L300 570 L470 380 L640 590 L760 500 L900 620 L1080 430 L1250 590 L1400 500 L1536 600 L1536 1024 L0 1024Z" fill="#1c3352" opacity=".7"/>
<path d="M0 760 L1536 760 L1536 1024 L0 1024Z" fill="url(#lake)" opacity=".85"/>
<g stroke="#7fa8d6" stroke-width="3" opacity=".35"><path d="M60 820h300M120 860h380M980 820h420M1060 870h360"/></g>

<!-- LEFT: trust shield / vault -->
<g filter="url(#sh)" transform="translate(150 250)">
<path d="M170 0 L340 50 V250 C340 380 260 450 170 500 C80 450 0 380 0 250 V50Z" fill="url(#stone)" stroke="#fff" stroke-width="6"/>
<path d="M170 30 L312 72 V246 C312 358 246 420 170 462 C94 420 28 358 28 246 V72Z" fill="#12233b"/>
<circle cx="170" cy="240" r="92" fill="none" stroke="url(#gold)" stroke-width="14"/>
<circle cx="170" cy="240" r="34" fill="url(#gold)"/>
<g stroke="url(#gold)" stroke-width="12" stroke-linecap="round"><path d="M170 148V110M170 332V370M78 240H40M262 240H300"/></g>
</g>

<!-- CENTER: assets -->
<g filter="url(#sh)" transform="translate(600 430)">
<!-- framed artwork -->
<g transform="rotate(-7 90 150)"><rect x="10" y="10" width="190" height="230" rx="6" fill="url(#gold)"/><rect x="30" y="30" width="150" height="190" fill="#f1e6cf"/><ellipse cx="105" cy="120" rx="52" ry="66" fill="#c7743a"/><circle cx="105" cy="96" r="22" fill="#e9b072"/></g>
<!-- cash bundle -->
<g transform="translate(180 170)"><rect width="200" height="96" rx="8" fill="#3f8a5a"/><rect x="14" y="14" width="172" height="68" rx="4" fill="none" stroke="#bfe6cb" stroke-width="4"/><circle cx="100" cy="48" r="20" fill="#bfe6cb"/></g>
<!-- coin stacks -->
<g transform="translate(300 60)"><g fill="url(#gold)" stroke="#8a5f0f" stroke-width="3"><ellipse cx="60" cy="200" rx="60" ry="18"/><ellipse cx="60" cy="176" rx="60" ry="18"/><ellipse cx="60" cy="152" rx="60" ry="18"/><ellipse cx="60" cy="128" rx="60" ry="18"/><ellipse cx="60" cy="104" rx="60" ry="18"/></g></g>
<!-- tag -->
<g transform="translate(60 -70)"><rect width="270" height="96" rx="48" fill="#d8202a"/><text x="135" y="66" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="56" fill="#fff">$50M+</text></g>
</g>

<!-- dashed path trust -> building -->
<path d="M470 470 C640 150 940 150 1040 400" fill="none" stroke="#f4d27a" stroke-width="7" stroke-dasharray="4 20" stroke-linecap="round"/>
<path d="M1040 400 l-8 -34 m8 34 l-32 -14" stroke="#f4d27a" stroke-width="7" stroke-linecap="round" fill="none"/>

<!-- RIGHT: government building -->
<g filter="url(#sh)" transform="translate(1000 330)">
<path d="M0 150 L200 30 L400 150Z" fill="url(#stone)"/>
<rect x="10" y="150" width="380" height="26" fill="#c4ccd9"/>
<g fill="url(#stone)"><rect x="34" y="176" width="44" height="240"/><rect x="118" y="176" width="44" height="240"/><rect x="202" y="176" width="44" height="240"/><rect x="286" y="176" width="44" height="240"/></g>
<rect x="0" y="416" width="400" height="30" fill="#c4ccd9"/><rect x="-24" y="446" width="448" height="30" fill="#aab4c4"/>
<circle cx="200" cy="108" r="22" fill="#12233b"/>
</g>
<!-- scales -->
<g transform="translate(1180 160)" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"><path d="M0 60V0M-60 20H60M-60 20l-26 50h52zM60 20l-26 50h52z"/></g>
</svg>
